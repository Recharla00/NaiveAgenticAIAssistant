name: advanced-rag
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_local_learning}
      POSTGRES_DB: advanced_rag
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d advanced_rag"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
